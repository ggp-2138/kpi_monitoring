services:
  app_g1:
    image: ggp2138/app_g1:latest
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  mysql:
    image: mysql:8.0
    container_name: mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: 12345
    command: --slow_query_log=ON --long_query_time=10
    ports:
      - "3306:3306"
    networks:
      - monitoring

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysql-exporter
    volumes:
      - ./mysql-exporter.cnf:/etc/mysql-exporter.cnf:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.my-cnf=/etc/mysql-exporter.cnf'
      - '--collect.info_schema.processlist'
      - '--collect.info_schema.innodb_metrics'
    ports:
      - "9104:9104"
    networks:
      - monitoring
    depends_on:
      - mysql
    restart: on-failure

  nginx:
    image: nginx:1.25.5
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "80:80"
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: -nginx.scrape-uri=http://nginx:80/status
    ports:
      - "9113:9113"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9093:9093"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.4
    volumes:
      - grafana-data:/var/lib/grafana
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring

  dingtalk-webhook:
    image: timonwong/prometheus-webhook-dingtalk:v2.1.0
    container_name: dingtalk-webhook
    network_mode: host  
    volumes:
      - ./dingtalk.yml:/etc/prometheus-webhook-dingtalk/config.yml
      - /etc/localtime:/etc/localtime:ro
        #    ports:
        #      - "8060:8060"
        #    networks:
        #      - monitoring

volumes:
  grafana-data:
    name: test_1_grafana_data
networks:
  monitoring:
